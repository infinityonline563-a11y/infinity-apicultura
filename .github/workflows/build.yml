name: Compilar APK Apícola

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java (OpenJDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias del sistema
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
            build-java-common git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            libltdl-dev libstdc++6:i386 zlib1g:i386

    - name: Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade buildozer Cython==0.29.36

    - name: Compilar APK con Buildozer
      run: |
        buildozer -v android debug

    - name: Subir APK como artefacto descargable
      uses: actions/upload-artifact@v4
      with:
        name: app-apicola-debug
        path: bin/*.apk
