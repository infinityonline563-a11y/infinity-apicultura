
name: Compilar APK Apícola

on:
  push:
    branches: [ main, principal ]
  workflow_dispatch:   # <--- ¡AGREGA ESTA LÍNEA AQUÍ!

jobs:
  build:
    runs-on: ubuntu-22.04
    # (el resto de tu código sigue exactamente igual...)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
              git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
              zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
              libssl-dev gettext build-essential ccache libltdl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.36 buildozer

      - name: Run Buildozer Build
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
